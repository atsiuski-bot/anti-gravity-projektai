[build]
  command = "npm run build"
  publish = "dist"
  # Skip the production build when a push changes only non-shippable files (docs, ADRs,
  # .claude/.agent runbooks, Firestore/Storage rules, functions/ — none of which Vite reads).
  # Netlify runs this command and CANCELS the build when it exits 0: git diff --quiet exits 0
  # when the listed paths are identical between the last built commit and this one, i.e. nothing
  # build-relevant changed. Any change under those paths — or a missing CACHED_COMMIT_REF on the
  # very first build — makes git exit non-zero and the build proceeds. Fail-open by design: the
  # ambiguous case builds.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html package.json package-lock.json vite.config.js tailwind.config.js postcss.config.js netlify.toml"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Firebase's sign-in helper keeps Firebase's own extensionless filenames, so nothing here can
# infer their type and they would be served as a download rather than executed. Mirrors
# public/_headers (Cloudflare Pages) so both hosts resolve the handshake identically. No
# `[[redirects]]` rule belongs with it — an exact asset match already beats the catch-all above,
# and a rewrite onto a `.html` copy collides with extensionless-URL canonicalization and loops.
# See docs/runbooks/firebase-auth-helper-selfhost.md.
[[headers]]
  for = "/__/auth/handler"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/__/auth/iframe"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/__/auth/links"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
